<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Επιβεβαίωση Συμμετοχής</title>

  <style>
    *{
      box-sizing:border-box
    }

    body{
      margin:0;
      padding:22px;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:#f3f5f8;
      color:#172033
    }

    .wrap{
      width:100%;
      max-width:760px;
      margin:0 auto
    }

    .card,
    .form-section{
      background:#fff;
      border-radius:18px;
      border:1px solid #e6e9ee;
      box-shadow:0 8px 28px rgba(0,0,0,.08)
    }

    .card{
      padding:28px 24px;
      text-align:center
    }

    .logo{
      max-width:280px;
      width:70%;
      height:auto;
      margin:4px auto 22px;
      display:block
    }

    .event-title{
      font-size:22px;
      font-weight:800;
      line-height:1.3;
      margin-bottom:8px
    }

    .event-date{
      color:#6b7280;
      font-size:15px;
      margin-bottom:28px
    }

    .visitor-name{
      font-size:26px;
      font-weight:800;
      margin-top:10px
    }

    .visitor-company{
      font-size:17px;
      color:#4b5563;
      margin-top:8px;
      line-height:1.4
    }

    .visitor-position{
      font-size:15px;
      color:#6b7280;
      margin-top:4px;
      line-height:1.4
    }

    .message{
      margin-top:24px;
      font-size:16px;
      line-height:1.55;
      color:#374151
    }

    .button{
      width:100%;
      margin-top:24px;
      padding:16px 18px;
      border:0;
      border-radius:12px;
      background:#111827;
      color:#fff;
      font-size:17px;
      font-weight:800;
      cursor:pointer
    }

    .button:disabled{
      opacity:.55;
      cursor:default
    }

    .status{
      margin-top:20px;
      padding:15px;
      border-radius:12px;
      font-weight:700;
      line-height:1.45
    }

    .status-loading{
      background:#eff6ff;
      color:#1d4ed8
    }

    .status-success{
      background:#dcfce7;
      color:#166534
    }

    .status-error{
      background:#fee2e2;
      color:#991b1b
    }

    .hidden{
      display:none
    }

    .form-section{
      margin-top:24px;
      padding:18px
    }

    .form-title{
      font-size:19px;
      font-weight:800;
      text-align:center;
      margin-bottom:14px
    }

    .form-frame{
      width:100%;
      min-height:900px;
      border:0;
      border-radius:12px;
      background:#fff
    }

    @media(max-width:600px){
      body{
        padding:12px
      }

      .card{
        padding:22px 16px
      }

      .event-title{
        font-size:19px
      }

      .visitor-name{
        font-size:23px
      }

      .form-section{
        padding:10px
      }

      .form-frame{
        min-height:1100px
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <img
      src="zoomlogo.jpg"
      alt="Καραγιλάνης Σύμβουλοι"
      class="logo"
      onerror="this.style.display='none'"
    >

    <div class="event-title">
      Ο ΝΕΟΣ ΚΩΔΙΚΑΣ ΤΟΠΙΚΗΣ ΑΥΤΟΔΙΟΙΚΗΣΗΣ ΣΤΗΝ ΠΡΑΞΗ
    </div>

    <div class="event-date">
      25/9/2026
    </div>

    <div
      id="loadingBox"
      class="status status-loading"
    >
      Φόρτωση στοιχείων...
    </div>

    <div
      id="visitorBox"
      class="hidden"
    >

      <div class="message">
        Καλώς ήρθατε,
      </div>

      <div
        id="visitorName"
        class="visitor-name"
      ></div>

      <div
        id="visitorCompany"
        class="visitor-company"
      ></div>

      <div
        id="visitorPosition"
        class="visitor-position"
      ></div>

      <div class="message">
        Παρακαλούμε επιβεβαιώστε τη συμμετοχή σας στη διοργάνωση.
      </div>

      <button
        id="confirmBtn"
        class="button"
        type="button"
      >
        ΕΠΙΒΕΒΑΙΩΝΩ ΤΗ ΣΥΜΜΕΤΟΧΗ ΜΟΥ
      </button>

      <div
        id="resultBox"
        class="hidden"
      ></div>

    </div>

  </div>


  <div
    id="formSection"
    class="form-section hidden"
  >

    <div class="form-title">
      Παρακαλούμε συμπληρώστε και την παρακάτω φόρμα
    </div>

    <iframe
      id="googleFormFrame"
      class="form-frame"
      title="Google Form"
      loading="lazy"
    ></iframe>

  </div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbzYDoinhNsl0oXgNCzdSTOmp0FYwJ1HDmQYsxFbhIBu5m-YWlz9OFrFDXisXyWxDPEF/exec';

const FORM_EMBED_URL =
  'https://docs.google.com/forms/d/e/1FAIpQLSf6ptY5LIcbJBtDN4LgynWwk20FCYlnsDzPtHvjUclNsdIMnA/viewform';


const loadingBox =
  document.getElementById(
    'loadingBox'
  );

const visitorBox =
  document.getElementById(
    'visitorBox'
  );

const visitorName =
  document.getElementById(
    'visitorName'
  );

const visitorCompany =
  document.getElementById(
    'visitorCompany'
  );

const visitorPosition =
  document.getElementById(
    'visitorPosition'
  );

const confirmBtn =
  document.getElementById(
    'confirmBtn'
  );

const resultBox =
  document.getElementById(
    'resultBox'
  );

const formSection =
  document.getElementById(
    'formSection'
  );

const googleFormFrame =
  document.getElementById(
    'googleFormFrame'
  );


const params =
  new URLSearchParams(
    window.location.search
  );

const token =
  params.get('token') || '';

let currentVisitor =
  null;


function jsonp(
  action,
  extraParams = {}
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const callbackName =
        'jsonp_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );

      const script =
        document.createElement(
          'script'
        );

      const query =
        new URLSearchParams({
          action,
          callback:
            callbackName,
          ...extraParams
        });

      const timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                'Η υπηρεσία άργησε να απαντήσει.'
              )
            );

          },
          15000
        );


      function cleanup(){

        clearTimeout(
          timeout
        );

        if (
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );

        }

        try {

          delete window[
            callbackName
          ];

        } catch(_) {

          window[
            callbackName
          ] =
            undefined;

        }

      }


      window[
        callbackName
      ] =
        function(data){

          cleanup();

          resolve(
            data
          );

        };


      script.onerror =
        function(){

          cleanup();

          reject(
            new Error(
              'Δεν ήταν δυνατή η σύνδεση με την υπηρεσία.'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        query.toString();


      document
        .body
        .appendChild(
          script
        );

    }
  );

}


function showError(
  message
){

  loadingBox.className =
    'status status-error';

  loadingBox.textContent =
    message;

}


function showForm(){

  if (
    !currentVisitor
  ) {
    return;
  }


  googleFormFrame.src =
    buildPrefilledFormUrl(
      currentVisitor
    );


  formSection
    .classList
    .remove(
      'hidden'
    );

}


function showConfirmed(
  alreadyCheckedIn,
  timestamp
){

  confirmBtn
    .classList
    .add(
      'hidden'
    );


  resultBox.className =
    'status status-success';


  if (
    alreadyCheckedIn
  ) {

    resultBox.innerHTML =
      '✓ Η συμμετοχή σας έχει ήδη καταχωρηθεί.';

  } else {

    resultBox.innerHTML =
      '✓ Η ΣΥΜΜΕΤΟΧΗ ΣΑΣ ΚΑΤΑΧΩΡΗΘΗΚΕ' +
      '<br><small>Σας ευχαριστούμε. Σας περιμένουμε στη διοργάνωση.</small>';

  }


  showForm();

}


async function loadVisitor(){

  if (
    !token
  ) {

    showError(
      'Ο σύνδεσμος επιβεβαίωσης δεν είναι έγκυρος.'
    );

    return;

  }


  if (
    !API_URL ||
    API_URL.includes(
      'PASTE_PRECHECKIN'
    )
  ) {

    showError(
      'Δεν έχει οριστεί ακόμα το API URL.'
    );

    return;

  }


  try {

    const data =
      await jsonp(
        'getVisitor',
        {
          token
        }
      );


    if (
      !data ||
      !data.success ||
      !data.found
    ) {

      throw new Error(
        'Ο σύνδεσμος επιβεβαίωσης δεν είναι έγκυρος.'
      );

    }


    currentVisitor =
      data;


    visitorName.textContent =
      data.name || '';


    visitorCompany.textContent =
      data.company || '';


    visitorPosition.textContent =
      data.position || '';


    loadingBox
      .classList
      .add(
        'hidden'
      );


    visitorBox
      .classList
      .remove(
        'hidden'
      );


  } catch(error) {

    console.error(
      error
    );

    showError(
      error.message ||
      'Παρουσιάστηκε σφάλμα.'
    );

  }

}


confirmBtn
  .addEventListener(
    'click',
    async function(){

      confirmBtn.disabled =
        true;

      confirmBtn.textContent =
        'ΚΑΤΑΧΩΡΗΣΗ...';


      try {

        const data =
          await jsonp(
            'confirmCheckin',
            {
              token
            }
          );


        if (
          !data ||
          !data.success
        ) {

          throw new Error(
            data &&
            data.message
              ? data.message
              : 'Η καταχώρηση απέτυχε.'
          );

        }


        showConfirmed(
          Boolean(
            data.alreadyCheckedIn
          ),
          data.timestamp || ''
        );


      } catch(error) {

        console.error(
          error
        );


        confirmBtn.disabled =
          false;

        confirmBtn.textContent =
          'ΕΠΙΒΕΒΑΙΩΝΩ ΤΗ ΣΥΜΜΕΤΟΧΗ ΜΟΥ';


        resultBox.className =
          'status status-error';

        resultBox.textContent =
          error.message ||
          'Η καταχώρηση απέτυχε. Δοκιμάστε ξανά.';

      }

    }
  );


function escapeHtml(
  value
){

  return String(
    value
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function buildPrefilledFormUrl(
  visitor
) {

  const params =
    new URLSearchParams();


  params.set(
    'usp',
    'pp_url'
  );


  params.set(
    'entry.481488761',
    visitor.name || ''
  );


  params.set(
    'entry.1770173014',
    visitor.company || ''
  );


  params.set(
    'entry.1222968948',
    visitor.email || ''
  );


  return (
    FORM_EMBED_URL +
    '?' +
    params.toString()
  );

}


loadVisitor();

</script>

</body>
</html>
