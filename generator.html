<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Badge Generator</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #f6f8fb 0%, #eef2f7 100%);
      color: #182235;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 22px;
    }
    .header h1 {
      font-size: 28px;
      margin: 0 0 7px;
    }
    .header p {
      color: #6b7280;
      margin: 0;
    }
    .card {
      background: #fff;
      border: 1px solid #e6e9ee;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.07);
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media(max-width:700px) {
      .grid { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #4b5563;
    }
    input[type=file] {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5dae2;
      border-radius: 12px;
      background: #fafafa;
    }
    .button {
      border: 0;
      border-radius: 13px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 750;
      cursor: pointer;
      width: 100%;
      margin-top: 18px;
    }
    .button-primary {
      background: #111827;
      color: white;
    }
    .button:disabled {
      opacity: .45;
      cursor: default;
    }
    #status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #f3f4f6;
      color: #4b5563;
      text-align: center;
    }
    .success { background:#dcfce7 !important; color:#166534 !important; }
    .error { background:#fee2e2 !important; color:#991b1b !important; }
    .working { background:#eff6ff !important; color:#1d4ed8 !important; }
    .preview-wrap {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .preview-block {
      text-align: center;
    }
    .preview-label {
      font-size: 12px;
      font-weight: 700;
      color:#6b7280;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }
    .preview-canvas {
      width: 240px;
      height: 360px;
      border: 1px solid #d6dae1;
      border-radius: 8px;
      background:white;
      box-shadow: 0 4px 14px rgba(0,0,0,.07);
    }
    .note {
      margin-top: 14px;
      font-size: 13px;
      color:#6b7280;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>QR Badge Generator</h1>
    <p>Excel → QR → καρτέλες 6×9 cm → PDF</p>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label>Αρχείο Excel (.xlsx)</label>
        <input id="excelFile" type="file" accept=".xlsx,.xls">
      </div>
      <div>
        <label>Λογότυπο (προαιρετικό - υπάρχει ήδη το προεπιλεγμένο)</label>
        <input id="logoFile" type="file" accept="image/*">
      </div>
    </div>

    <button id="generateBtn" class="button button-primary" disabled>
      ΔΗΜΙΟΥΡΓΙΑ PDF
    </button>

    <div id="status">Επίλεξε το Excel με στήλες CODE, NAME, COMPANY.</div>

    <div class="note">
      Το CODE μπαίνει μόνο μέσα στο QR και δεν εμφανίζεται τυπωμένο.
      Κάθε επισκέπτης δημιουργεί 2 σελίδες PDF: εμπρός και πίσω.
    </div>
  </div>

  <div class="card">
    <div class="preview-wrap">
      <div class="preview-block">
        <div class="preview-label">Μπροστά</div>
        <canvas id="frontPreview" class="preview-canvas" width="600" height="900"></canvas>
      </div>
      <div class="preview-block">
        <div class="preview-label">Πίσω</div>
        <canvas id="backPreview" class="preview-canvas" width="600" height="900"></canvas>
      </div>
    </div>
  </div>
</div>

let rows = [];
let logoDataUrl = DEFAULT_LOGO;

const excelInput = document.getElementById("excelFile");
const logoInput = document.getElementById("logoFile");
const generateBtn = document.getElementById("generateBtn");
const statusBox = document.getElementById("status");

excelInput.addEventListener("change", readExcel);
logoInput.addEventListener("change", readLogo);
generateBtn.addEventListener("click", generatePdf);

function setStatus(text, cls="") {
  statusBox.className = cls;
  statusBox.textContent = text;
}

async function readLogo(e) {
  const file = e.target.files[0];
  if (!file) {
    logoDataUrl = DEFAULT_LOGO;
    return;
  }
  logoDataUrl = await fileToDataUrl(file);
  if (rows.length) renderPreview(rows[0]);
}

async function readExcel(e) {
  const file = e.target.files[0];
  generateBtn.disabled = true;
  if (!file) return;

  try {
    setStatus("Ανάγνωση Excel...", "working");
    const data = await file.arrayBuffer();
    const wb = XLSX.read(data, {type:"array"});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(ws, {defval:""});

    if (!json.length) throw new Error("Το Excel δεν έχει δεδομένα.");

    const headers = Object.keys(json[0]).map(x => String(x).trim().toUpperCase());
    for (const req of ["CODE","NAME","COMPANY"]) {
      if (!headers.includes(req)) {
        throw new Error(`Λείπει η στήλη ${req}.`);
      }
    }

    rows = json
      .map(r => {
        const obj = {};
        for (const [k,v] of Object.entries(r)) {
          obj[String(k).trim().toUpperCase()] = v;
        }
        return {
          code: String(obj.CODE || "").trim(),
          name: String(obj.NAME || "").trim(),
          company: String(obj.COMPANY || "").trim()
        };
      })
      .filter(r => r.code && r.name);

    if (!rows.length) throw new Error("Δεν βρέθηκαν έγκυρες γραμμές CODE/NAME.");

    generateBtn.disabled = false;
    setStatus(`Βρέθηκαν ${rows.length} επισκέπτες. Έτοιμο για δημιουργία PDF.`, "success");
    await renderPreview(rows[0]);

  } catch(err) {
    console.error(err);
    rows = [];
    setStatus("Σφάλμα: " + err.message, "error");
  }
}

function fileToDataUrl(file) {
  return new Promise((resolve,reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

function loadImage(src) {
  return new Promise((resolve,reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function fitText(ctx, text, maxWidth, startPx, minPx, weight=700) {
  let size = startPx;
  while (size > minPx) {
    ctx.font = `${weight} ${size}px Arial, sans-serif`;
    if (ctx.measureText(text).width <= maxWidth) break;
    size -= 2;
  }
  return size;
}

function wrapText(ctx, text, maxWidth) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let line = "";
  for (const word of words) {
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width <= maxWidth) line = test;
    else {
      if (line) lines.push(line);
      line = word;
    }
  }
  if (line) lines.push(line);
  return lines;
}

async function drawFront(canvas, person) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,W,H);

  // 1 cm top margin on a 9 cm-high card = 100 px in this 900px canvas.
  const topMargin = 100;

  const logo = await loadImage(logoDataUrl);
  const maxLogoW = 440;
  const maxLogoH = 135;
  const scale = Math.min(maxLogoW/logo.width, maxLogoH/logo.height);
  const lw = logo.width * scale;
  const lh = logo.height * scale;
  ctx.drawImage(logo, (W-lw)/2, topMargin, lw, lh);

  let y = topMargin + lh + 70;

  ctx.fillStyle = "#111827";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  let nameSize = fitText(ctx, person.name, 510, 48, 30, 800);
  ctx.font = `800 ${nameSize}px Arial, sans-serif`;
  let nameLines = wrapText(ctx, person.name, 510);
  nameLines = nameLines.slice(0,2);
  for (const line of nameLines) {
    ctx.fillText(line, W/2, y);
    y += nameSize * 1.15;
  }

  if (person.company) {
    y += 35;
    ctx.fillStyle = "#4b5563";
    const companySize = fitText(ctx, person.company, 500, 31, 22, 500);
    ctx.font = `500 ${companySize}px Arial, sans-serif`;
    const companyLines = wrapText(ctx, person.company, 500).slice(0,3);
    for (const line of companyLines) {
      ctx.fillText(line, W/2, y);
      y += companySize * 1.25;
    }
  }
}

async function drawBack(canvas, person) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,W,H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#111827";

  let nameSize = fitText(ctx, person.name, 500, 40, 28, 800);
  ctx.font = `800 ${nameSize}px Arial, sans-serif`;
  let nameLines = wrapText(ctx, person.name, 500).slice(0,2);
  let y = 105;
  for (const line of nameLines) {
    ctx.fillText(line, W/2, y);
    y += nameSize * 1.12;
  }

  const qr = qrcode(0, "M");
  qr.addData(person.code);
  qr.make();

  const qrImg = await loadImage(qr.createDataURL(10, 4));
  const qrY = 245;
  ctx.drawImage(qrImg, 90, qrY, 420, 420);

  ctx.fillStyle = "#4b5563";
  ctx.font = "700 25px Arial, sans-serif";
  ctx.fillText("ΣΑΡΩΣΗ ΚΑΤΑ ΤΗΝ ΕΙΣΟΔΟ", W/2, 735);
}

async function renderPreview(person) {
  await drawFront(document.getElementById("frontPreview"), person);
  await drawBack(document.getElementById("backPreview"), person);
}

async function generatePdf() {
  if (!rows.length) return;

  generateBtn.disabled = true;
  setStatus(`Δημιουργία PDF για ${rows.length} επισκέπτες...`, "working");

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: "portrait",
      unit: "mm",
      format: [60,90],
      compress: true
    });

    const front = document.createElement("canvas");
    front.width = 600; front.height = 900;
    const back = document.createElement("canvas");
    back.width = 600; back.height = 900;

    let firstPage = true;

    for (let i=0; i<rows.length; i++) {
      const p = rows[i];

      await drawFront(front, p);
      if (!firstPage) pdf.addPage([60,90], "portrait");
      firstPage = false;
      pdf.addImage(front.toDataURL("image/jpeg", .94), "JPEG", 0, 0, 60, 90, undefined, "FAST");

      await drawBack(back, p);
      pdf.addPage([60,90], "portrait");
      pdf.addImage(back.toDataURL("image/jpeg", .94), "JPEG", 0, 0, 60, 90, undefined, "FAST");

      if ((i+1) % 25 === 0 || i === rows.length-1) {
        setStatus(`Δημιουργία: ${i+1} / ${rows.length} επισκέπτες...`, "working");
        await new Promise(r => setTimeout(r, 0));
      }
    }

    pdf.save("qr_badges_6x9.pdf");
    setStatus(`Έτοιμο: ${rows.length} καρτέλες / ${rows.length*2} σελίδες PDF.`, "success");

  } catch(err) {
    console.error(err);
    setStatus("Σφάλμα δημιουργίας PDF: " + err.message, "error");
  } finally {
    generateBtn.disabled = false;
  }
}
</script>
