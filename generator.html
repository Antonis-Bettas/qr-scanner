<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Badge Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#f6f8fb 0%,#eef2f7 100%);color:#182235}.wrap{max-width:1000px;margin:0 auto}.header{text-align:center;margin-bottom:22px}.header h1{margin:0 0 6px;font-size:28px}.header p{margin:0;color:#6b7280}.card{background:#fff;border:1px solid #e6e9ee;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.07);margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#4b5563}input[type=file],select{width:100%;padding:12px;border:1px solid #d5dae2;border-radius:10px;background:#fafafa;font-size:14px}.badge-type-wrap{margin-top:18px}.badge-type-title{font-size:13px;font-weight:700;color:#4b5563;margin-bottom:9px}.badge-type-switch{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.badge-type-option{border:2px solid #d7dce3;background:#fff;color:#263244;border-radius:13px;padding:13px 14px;font-size:15px;font-weight:800;cursor:pointer}.badge-type-option.active{border-color:#111827;background:#111827;color:#fff}.badge-type-option.staff.active{border-color:#b91c1c;background:#b91c1c;color:#fff}.badge-type-option.speaker.active{border-color:#1d4ed8;background:#1d4ed8;color:#fff}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}@media(max-width:700px){.buttons{grid-template-columns:1fr}}.button{width:100%;padding:14px 18px;border:0;border-radius:12px;font-size:16px;font-weight:750;cursor:pointer}.button-primary{background:#111827;color:white}.button-secondary{background:#e8eef7;color:#172033}.button:disabled{opacity:.45;cursor:default}#status{margin-top:16px;padding:14px;border-radius:12px;background:#f3f4f6;color:#4b5563;text-align:center}.success{background:#dcfce7!important;color:#166534!important}.error{background:#fee2e2!important;color:#991b1b!important}.working{background:#eff6ff!important;color:#1d4ed8!important}.preview-wrap{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}.preview-block{text-align:center}.preview-label{font-size:12px;font-weight:700;color:#6b7280;margin-bottom:7px;text-transform:uppercase;letter-spacing:.7px}.preview-canvas{width:360px;height:240px;border:1px solid #d6dae1;border-radius:8px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.07)}.note{margin-top:14px;font-size:13px;color:#6b7280;line-height:1.5}
  </style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>QR Badge Generator</h1><p>Excel → QR → 9×6 cm → PDF / A4 εκτύπωσης</p></div>
  <div class="card">
    <div class="grid">
      <div><label>Αρχείο Excel (.xlsx)</label><input id="excelFile" type="file" accept=".xlsx,.xls"></div>
      <div><label>Λογότυπο</label><input id="logoFile" type="file" accept="image/*"></div>
    </div>
    <div class="badge-type-wrap">
      <div class="badge-type-title">Τύπος καρτέλας</div>
      <div class="badge-type-switch">
        <button id="visitorTypeBtn" type="button" class="badge-type-option active">ΕΠΙΣΚΕΠΤΗΣ</button>
        <button id="staffTypeBtn" type="button" class="badge-type-option staff">ΠΡΟΣΩΠΙΚΟ ΕΤΑΙΡΕΙΑΣ</button>
        <button id="speakerTypeBtn" type="button" class="badge-type-option speaker">ΕΙΣΗΓΗΤΗΣ</button>
      </div>
    </div>
    <div class="grid" style="margin-top:16px;">
      <div><label>Στοίχιση πίσω όψης για duplex</label><select id="duplexMode"><option value="same">Ίδιες θέσεις</option><option value="mirrorX">Καθρέφτισμα αριστερά ↔ δεξιά</option><option value="mirrorY" selected>Καθρέφτισμα πάνω ↔ κάτω</option></select></div><div></div>
    </div>
    <div class="buttons"><button id="generateSingleBtn" class="button button-secondary" disabled>PDF ΚΑΡΤΕΛΩΝ 9×6</button><button id="generateA4Btn" class="button button-primary" disabled>PDF A4 ΓΙΑ ΕΚΤΥΠΩΣΗ</button></div>
    <div id="status">Επίλεξε Excel με στήλες CODE, NAME, COMPANY.</div>
    <div class="note">Δεν χρειάζεται αλλαγή στο Excel. Η επιλογή «Προσωπικό εταιρείας» αλλάζει μόνο τη μακέτα. Το CODE δεν τυπώνεται — χρησιμοποιείται μόνο μέσα στο QR.</div>
  </div>
  <div class="card"><div class="preview-wrap"><div class="preview-block"><div class="preview-label">Μπροστά</div><canvas id="frontPreview" class="preview-canvas" width="900" height="600"></canvas></div><div class="preview-block"><div class="preview-label">Πίσω</div><canvas id="backPreview" class="preview-canvas" width="900" height="600"></canvas></div></div></div>
</div>
<script>
let rows=[],logoDataUrl=null,badgeType="visitor";
const excelInput=document.getElementById("excelFile"),logoInput=document.getElementById("logoFile"),generateSingleBtn=document.getElementById("generateSingleBtn"),generateA4Btn=document.getElementById("generateA4Btn"),statusBox=document.getElementById("status"),duplexMode=document.getElementById("duplexMode"),visitorTypeBtn=document.getElementById("visitorTypeBtn"),staffTypeBtn=document.getElementById("staffTypeBtn"),speakerTypeBtn=document.getElementById("speakerTypeBtn");
excelInput.addEventListener("change",readExcel);logoInput.addEventListener("change",readLogo);generateSingleBtn.addEventListener("click",generateSinglePdf);generateA4Btn.addEventListener("click",generateA4Pdf);
visitorTypeBtn.addEventListener("click",async()=>{badgeType="visitor";visitorTypeBtn.classList.add("active");staffTypeBtn.classList.remove("active");speakerTypeBtn.classList.remove("active");if(rows.length)await renderPreview(rows[0]);});
staffTypeBtn.addEventListener("click",async()=>{badgeType="staff";staffTypeBtn.classList.add("active");visitorTypeBtn.classList.remove("active");speakerTypeBtn.classList.remove("active");if(rows.length)await renderPreview(rows[0]);});
speakerTypeBtn.addEventListener("click",async()=>{badgeType="speaker";speakerTypeBtn.classList.add("active");visitorTypeBtn.classList.remove("active");staffTypeBtn.classList.remove("active");if(rows.length)await renderPreview(rows[0]);});
function setStatus(text,cls=""){statusBox.className=cls;statusBox.textContent=text}
async function readLogo(e){const file=e.target.files[0];if(!file){logoDataUrl=null;return}logoDataUrl=await fileToDataUrl(file);if(rows.length)await renderPreview(rows[0])}
async function readExcel(e){const file=e.target.files[0];generateSingleBtn.disabled=true;generateA4Btn.disabled=true;if(!file)return;try{setStatus("Ανάγνωση Excel...","working");const data=await file.arrayBuffer(),wb=XLSX.read(data,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],json=XLSX.utils.sheet_to_json(ws,{defval:""});if(!json.length)throw new Error("Το Excel δεν έχει δεδομένα.");const headers=Object.keys(json[0]).map(x=>String(x).trim().toUpperCase());for(const req of ["CODE","NAME","COMPANY"])if(!headers.includes(req))throw new Error("Λείπει η στήλη "+req);rows=json.map(r=>{const obj={};for(const[k,v]of Object.entries(r))obj[String(k).trim().toUpperCase()]=v;return{code:String(obj.CODE||"").trim(),name:String(obj.NAME||"").trim(),company:String(obj.COMPANY||"").trim()}}).filter(r=>r.code&&r.name);if(!rows.length)throw new Error("Δεν βρέθηκαν έγκυρες εγγραφές.");generateSingleBtn.disabled=false;generateA4Btn.disabled=false;setStatus("Βρέθηκαν "+rows.length+" άτομα.","success");await renderPreview(rows[0])}catch(err){console.error(err);rows=[];setStatus("Σφάλμα: "+err.message,"error")}}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=src})}
function fitText(ctx,text,maxWidth,startPx,minPx,weight=700){let size=startPx;while(size>minPx){ctx.font=weight+" "+size+"px Arial, sans-serif";if(ctx.measureText(text).width<=maxWidth)break;size-=2}return size}
function wrapText(ctx,text,maxWidth){const words=String(text).split(/\s+/),lines=[];let line="";for(const word of words){const test=line?line+" "+word:word;if(ctx.measureText(test).width<=maxWidth)line=test;else{if(line)lines.push(line);line=word}}if(line)lines.push(line);return lines}
function drawRoleBand(ctx,W,H,position="top"){const bh=82;const isSpeaker=badgeType==="speaker";ctx.fillStyle=isSpeaker?"#1d4ed8":"#b91c1c";const label=isSpeaker?"ΕΙΣΗΓΗΤΗΣ":"ΟΜΑΔΑ ΔΙΟΡΓΑΝΩΣΗΣ";if(position==="top"){ctx.fillRect(0,0,W,bh);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="800 31px Arial, sans-serif";ctx.fillText(label,W/2,bh/2)}else{ctx.fillRect(0,H-bh,W,bh);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="800 31px Arial, sans-serif";ctx.fillText(label,W/2,H-bh/2)}}
async function drawFront(canvas,person){const ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);if(badgeType!=="visitor")drawRoleBand(ctx,W,H,"top");let y=badgeType!=="visitor"?115:100;if(logoDataUrl){const logo=await loadImage(logoDataUrl),maxLogoW=badgeType!=="visitor"?440:520,maxLogoH=badgeType!=="visitor"?95:105,scale=Math.min(maxLogoW/logo.width,maxLogoH/logo.height),lw=logo.width*scale,lh=logo.height*scale;ctx.drawImage(logo,(W-lw)/2,y,lw,lh);y+=lh+(badgeType!=="visitor"?50:65)}else y+=55;ctx.fillStyle="#111827";ctx.textAlign="center";ctx.textBaseline="middle";const nameSize=fitText(ctx,person.name,760,badgeType!=="visitor"?52:55,34,800);ctx.font="800 "+nameSize+"px Arial, sans-serif";for(const line of wrapText(ctx,person.name,760).slice(0,2)){ctx.fillText(line,W/2,y);y+=nameSize*1.15}if(person.company){y+=35;ctx.fillStyle="#111827";const companySize=fitText(ctx,person.company,760,44,30,700);ctx.font="700 "+companySize+"px Arial, sans-serif";for(const line of wrapText(ctx,person.company,760).slice(0,2)){ctx.fillText(line,W/2,y);y+=companySize*1.2}}}
function createQrDataUrl(code){const qr=qrcode(0,"M");qr.addData(code);qr.make();return qr.createDataURL(10,3)}
function rotateCanvas180(sourceCanvas){const rotated=document.createElement("canvas");rotated.width=sourceCanvas.width;rotated.height=sourceCanvas.height;const ctx=rotated.getContext("2d");ctx.translate(rotated.width,rotated.height);ctx.rotate(Math.PI);ctx.drawImage(sourceCanvas,0,0);return rotated}
async function drawBack(canvas,person){const ctx=canvas.getContext("2d"),W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);if(badgeType!=="visitor")drawRoleBand(ctx,W,H,"bottom");ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#111827";const nameSize=fitText(ctx,person.name,760,45,30,800);ctx.font="800 "+nameSize+"px Arial, sans-serif";let y=70;for(const line of wrapText(ctx,person.name,760).slice(0,2)){ctx.fillText(line,W/2,y);y+=nameSize*1.08}const qrImg=await loadImage(createQrDataUrl(person.code)),qrSize=badgeType!=="visitor"?300:330,qrY=badgeType!=="visitor"?170:180;ctx.drawImage(qrImg,(W-qrSize)/2,qrY,qrSize,qrSize);ctx.fillStyle="#4b5563";ctx.font=badgeType!=="visitor"?"700 23px Arial, sans-serif":"700 26px Arial, sans-serif";ctx.fillText("ΣΑΡΩΣΗ ΚΑΤΑ ΤΗΝ ΕΙΣΟΔΟ",W/2,badgeType!=="visitor"?500:555)}
async function renderPreview(person){await drawFront(document.getElementById("frontPreview"),person);await drawBack(document.getElementById("backPreview"),person)}
async function makeBadgeCanvas(person,side){const c=document.createElement("canvas");c.width=900;c.height=600;if(side==="front")await drawFront(c,person);else await drawBack(c,person);return c}
async function generateSinglePdf(){if(!rows.length)return;generateSingleBtn.disabled=true;generateA4Btn.disabled=true;setStatus("Δημιουργία PDF 9×6...","working");try{const{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"landscape",unit:"mm",format:[90,60],compress:true});let firstPage=true;for(let i=0;i<rows.length;i++){const front=await makeBadgeCanvas(rows[i],"front");if(!firstPage)pdf.addPage([90,60],"landscape");firstPage=false;pdf.addImage(front.toDataURL("image/jpeg",.95),"JPEG",0,0,90,60,undefined,"FAST");const back=await makeBadgeCanvas(rows[i],"back");pdf.addPage([90,60],"landscape");pdf.addImage(back.toDataURL("image/jpeg",.95),"JPEG",0,0,90,60,undefined,"FAST")}pdf.save("qr_badges_9x6_"+(badgeType==="staff"?"staff":badgeType==="speaker"?"speakers":"visitors")+".pdf");setStatus("Έτοιμο PDF 9×6: "+rows.length+" καρτέλες.","success")}catch(err){setStatus("Σφάλμα: "+err.message,"error")}finally{generateSingleBtn.disabled=false;generateA4Btn.disabled=false}}
function cropMarks(pdf,x,y,w,h){const m=3;pdf.setDrawColor(120);pdf.setLineWidth(.15);pdf.line(x-m,y,x-.5,y);pdf.line(x,y-m,x,y-.5);pdf.line(x+w+.5,y,x+w+m,y);pdf.line(x+w,y-m,x+w,y-.5);pdf.line(x-m,y+h,x-.5,y+h);pdf.line(x,y+h+.5,x,y+h+m);pdf.line(x+w+.5,y+h,x+w+m,y+h);pdf.line(x+w,y+h+.5,x+w,y+h+m)}
function slotForIndex(localIndex,mode,isBack){let row=Math.floor(localIndex/3),col=localIndex%3;if(isBack){if(mode==="mirrorX")col=2-col;if(mode==="mirrorY")row=2-row}return{row,col}}
async function addA4Side(pdf,people,side,mode,addPageFirst){if(addPageFirst)pdf.addPage("a4","landscape");const pageW=297,pageH=210,cardW=90,cardH=60,startX=(pageW-cardW*3)/2,startY=(pageH-cardH*3)/2;for(let i=0;i<people.length;i++){const{row,col}=slotForIndex(i,mode,side==="back"),x=startX+col*cardW,y=startY+row*cardH;let canvas=await makeBadgeCanvas(people[i],side);if(side==="back"&&mode==="mirrorY")canvas=rotateCanvas180(canvas);pdf.addImage(canvas.toDataURL("image/jpeg",.94),"JPEG",x,y,cardW,cardH,undefined,"FAST");cropMarks(pdf,x,y,cardW,cardH)}}
async function generateA4Pdf(){if(!rows.length)return;generateSingleBtn.disabled=true;generateA4Btn.disabled=true;const mode=duplexMode.value;setStatus("Δημιουργία A4 PDF...","working");try{const{jsPDF}=window.jspdf,pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true}),perSheet=9,groups=Math.ceil(rows.length/perSheet);for(let g=0;g<groups;g++){const people=rows.slice(g*perSheet,(g+1)*perSheet);await addA4Side(pdf,people,"front",mode,g!==0);await addA4Side(pdf,people,"back",mode,true);setStatus("A4 φύλλο "+(g+1)+" / "+groups,"working");await new Promise(r=>setTimeout(r,0))}pdf.save("qr_badges_A4_duplex_"+(badgeType==="staff"?"staff":badgeType==="speaker"?"speakers":"visitors")+".pdf");setStatus("Έτοιμο A4 PDF για "+rows.length+" άτομα.","success")}catch(err){setStatus("Σφάλμα δημιουργίας A4 PDF: "+err.message,"error")}finally{generateSingleBtn.disabled=false;generateA4Btn.disabled=false}}
</script>
</body>
</html>
